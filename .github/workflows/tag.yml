name: Manual Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest
    # Creates the tag and its release directly with GITHUB_TOKEN. Tags pushed with GITHUB_TOKEN do
    # not trigger release.yml, so this used to need a personal access token; creating the release
    # here instead keeps that broad, long-lived credential out of the repository entirely.
    permissions:
      contents: write
    
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "❌ Error: Tag format is invalid. Must be semantic version like v1.0.0"
            echo "Provided: $TAG"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG"
      
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      
      - name: Check if tag already exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags
          if git tag -l | grep -q "^${TAG}$"; then
            echo "❌ Error: Tag '$TAG' already exists"
            echo "Existing tags:"
            git tag -l | tail -10
            exit 1
          fi
          echo "✅ Tag '$TAG' does not exist, proceeding..."
      
      - name: Create tag and release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Creating tag and release: $TAG"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
          echo "✅ Successfully created tag and release: $TAG"
