name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history and tags, so the build can stamp the About page with `git describe --tags`
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: cd web && pnpm build

      - name: Patch wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: node scripts/patch-wrangler.mjs wrangler.toml

      - name: Write secrets file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # Required secrets: fail closed if any is missing or empty.
          for name in JWT_SECRET SETUP_SECRET CF_D1_API_TOKEN; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "::error::missing secret: ${name}"
              exit 1
            fi
          done
          jq -n \
            --arg JWT_SECRET "${JWT_SECRET}" \
            --arg SETUP_SECRET "${SETUP_SECRET}" \
            --arg CF_D1_API_TOKEN "${CF_D1_API_TOKEN}" \
            '{JWT_SECRET: $JWT_SECRET, SETUP_SECRET: $SETUP_SECRET, CF_D1_API_TOKEN: $CF_D1_API_TOKEN}' \
            > "$RUNNER_TEMP/secrets.json"
          chmod 0600 "$RUNNER_TEMP/secrets.json"

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
