name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: cd web && pnpm build

      - name: Patch wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          QUERY_DB_1_NAME: ${{ vars.QUERY_DB_1_NAME }}
          QUERY_DB_1_ID: ${{ vars.QUERY_DB_1_ID }}
          QUERY_DB_2_NAME: ${{ vars.QUERY_DB_2_NAME }}
          QUERY_DB_2_ID: ${{ vars.QUERY_DB_2_ID }}
          QUERY_DB_3_NAME: ${{ vars.QUERY_DB_3_NAME }}
          QUERY_DB_3_ID: ${{ vars.QUERY_DB_3_ID }}
          QUERY_DB_4_NAME: ${{ vars.QUERY_DB_4_NAME }}
          QUERY_DB_4_ID: ${{ vars.QUERY_DB_4_ID }}
          QUERY_DB_5_NAME: ${{ vars.QUERY_DB_5_NAME }}
          QUERY_DB_5_ID: ${{ vars.QUERY_DB_5_ID }}
          QUERY_DB_6_NAME: ${{ vars.QUERY_DB_6_NAME }}
          QUERY_DB_6_ID: ${{ vars.QUERY_DB_6_ID }}
          QUERY_DB_7_NAME: ${{ vars.QUERY_DB_7_NAME }}
          QUERY_DB_7_ID: ${{ vars.QUERY_DB_7_ID }}
          QUERY_DB_8_NAME: ${{ vars.QUERY_DB_8_NAME }}
          QUERY_DB_8_ID: ${{ vars.QUERY_DB_8_ID }}
          QUERY_DB_9_NAME: ${{ vars.QUERY_DB_9_NAME }}
          QUERY_DB_9_ID: ${{ vars.QUERY_DB_9_ID }}
          QUERY_DB_10_NAME: ${{ vars.QUERY_DB_10_NAME }}
          QUERY_DB_10_ID: ${{ vars.QUERY_DB_10_ID }}
        run: node scripts/patch-wrangler.mjs wrangler.toml

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
