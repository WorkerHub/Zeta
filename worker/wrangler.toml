name = "zeta"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"
keep_vars = true

[vars]
CF_ACCOUNT_ID = "CF_ACCOUNT_ID_PLACEHOLDER"
ZETA_APP_DB_ID = "ZETA_APP_DB_ID_PLACEHOLDER"
ALLOW_APP_DB_AS_TARGET = "ALLOW_APP_DB_AS_TARGET_PLACEHOLDER"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id   = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

# Secrets – set via dashboard or `wrangler secret put`:
#   JWT_SECRET        – random 64-char string
#   ENCRYPTION_KEY    – 64-char hex (32 bytes) for AES-GCM TOTP encryption
#   SETUP_SECRET      – random string used to protect POST /api/setup
#   CLOUDFLARE_API_TOKEN   – API token with "D1 → Edit" permission (lists + queries target D1s)
