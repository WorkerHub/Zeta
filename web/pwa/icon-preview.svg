<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Inter, -apple-system, 'PingFang SC', sans-serif">
  <title>Zeta app icon set</title>
  <rect width="1200" height="740" fill="#f7f5f2"/>
  <text x="48" y="54" font-size="22" font-weight="600" fill="#1c1815">Zeta — home-screen icon set</text>
  <text x="48" y="82" font-size="14" fill="#7a706a">Terracotta #C25E3F tile, reversed-out database mark at 56% — about 22% clear space on every side.</text>

  <!-- iOS home screen simulation (icon drawn at 180, shown at 140) -->
  <g transform="translate(48 116)">
    <rect width="300" height="340" rx="24" fill="#2e2824"/>
    <image x="80" y="34" width="140" height="140" href="data:image/png;base64,"/>
    <rect x="80" y="34" width="140" height="140" rx="31.3" fill="none" stroke="#4a423c"/>
    <text x="150" y="204" font-size="15" fill="#f5f2ef" text-anchor="middle">Zeta</text>
    <text x="150" y="252" font-size="12" fill="#948a82" text-anchor="middle">apple-touch-icon, 180×180</text>
    <text x="150" y="274" font-size="12" fill="#948a82" text-anchor="middle">opaque (no alpha) · 22.4% radius</text>
    <text x="150" y="296" font-size="12" fill="#948a82" text-anchor="middle">status bar: default</text>
  </g>

  <!-- Android maskable: round launcher crop + the 40% safe circle -->
  <g transform="translate(392 116)">
    <rect width="340" height="340" rx="24" fill="#ffffff"/>
    <defs><clipPath id="round"><circle cx="170" cy="170" r="150"/></clipPath></defs>
    <image x="20" y="20" width="300" height="300" href="data:image/png;base64," clip-path="url(#round)"/>
    <circle cx="170" cy="170" r="150" fill="none" stroke="#d3ccc5" stroke-width="1.5"/>
    <circle cx="170" cy="170" r="120" fill="none" stroke="#c25e3f" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>

  <!-- the committed files -->
  <g transform="translate(48 500)">
    <image x="0" y="0" width="180" height="180" href="data:image/png;base64,"/>
    <text x="0" y="200" font-size="12" fill="#4a423c">icon-192x192.png</text>
    <image x="232" y="30" width="120" height="120" href="data:image/png;base64,"/>
    <text x="232" y="170" font-size="12" fill="#4a423c">icon-512x512.png</text>
    <text x="232" y="188" font-size="12" fill="#7a706a">= maskable-512x512.png</text>
    <image x="424" y="30" width="120" height="120" href="data:image/png;base64,"/>
    <text x="424" y="170" font-size="12" fill="#4a423c">apple-touch-icon-180x180.png</text>
    <text x="424" y="188" font-size="12" fill="#7a706a">shown at 120</text>
  </g>

  <g font-size="13" fill="#4a423c">
    <text x="820" y="140">Left — on a dark home screen. The same tile on a light</text>
    <text x="820" y="162">background keeps its contrast, so one asset serves both.</text>
    <text x="820" y="200">Middle — Android launcher round crop of the maskable icon;</text>
    <text x="820" y="222">the dashed circle is the 40% safe zone, the mark is inside it.</text>
    <text x="820" y="260">Every size is generated from one source, public/pwa/app-icon.svg,</text>
    <text x="820" y="282">by `pnpm pwa:icons`; the PNGs are committed.</text>
  </g>
  <g font-size="13" fill="#7a706a">
    <text x="820" y="330">Manifest: 192 + 512 (purpose any) + 512 maskable.</text>
    <text x="820" y="352">index.html: apple-touch-icon 180, theme-color #211d1a,</text>
    <text x="820" y="374">background_color #f7f5f2.</text>
    <text x="820" y="412">This sheet is not shipped with the app: it documents the</text>
    <text x="820" y="434">icon set for the review gate.</text>
  </g>
</svg>
